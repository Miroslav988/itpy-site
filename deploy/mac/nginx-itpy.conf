# nginx in front of the site: HTTPS, www → bare domain, gzip and a request limit per address.
# Build files already come with long cache headers from the site itself. install.sh fills in
# __DOMAIN__, __ACME__ and __CERTS__ and puts the result into
# $(brew --prefix)/etc/nginx/servers/itpy.conf.

limit_req_zone $binary_remote_addr zone=itpy:10m rate=20r/s;

upstream itpy_site {
  server 127.0.0.1:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name __DOMAIN__ www.__DOMAIN__;

  # Let's Encrypt checks the domain here when issuing and renewing the certificate.
  location /.well-known/acme-challenge/ { root __ACME__; }
  location / { return 301 https://__DOMAIN__$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.__DOMAIN__;
  ssl_certificate __CERTS__/fullchain.pem;
  ssl_certificate_key __CERTS__/privkey.pem;
  return 301 https://__DOMAIN__$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name __DOMAIN__;

  ssl_certificate __CERTS__/fullchain.pem;
  ssl_certificate_key __CERTS__/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:itpy_ssl:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  client_max_body_size 1m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  limit_req zone=itpy burst=60 nodelay;
  limit_req_status 429;

  location /.well-known/acme-challenge/ { root __ACME__; }

  location / {
    proxy_pass http://itpy_site;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }
}
